# .github/workflows/test.yml
name: test

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs when a new push lands on the same branch — saves
# CI time during iterative review (force-pushes, fixup commits). The
# `head_ref || ref_name` fallback handles both pull_request runs (where
# `head_ref` is the source branch) and push-to-main runs (where it's
# empty, so `ref_name` = `main` is used instead).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-node-snapshot
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: isolated-vm smoke
        run: |
          node --input-type=module -e "
          import('isolated-vm').then(async (mod) => {
            const ivm = mod.default ?? mod;
            const isolate = new ivm.Isolate({ memoryLimit: 32 });
            const ctx = await isolate.createContext();
            const script = await isolate.compileScript('1 + 1');
            const result = await script.run(ctx, { timeout: 1000, copy: true });
            if (result !== 2) { console.error('unexpected:', result); process.exit(1); }
            isolate.dispose();
            console.log('isolated-vm smoke ok');
          })
          "

      - run: pnpm run build

      - name: verify generated files are committed and unmodified
        run: |
          git diff --exit-code \
            src/mcp/search-docs/embedded-index.ts \
            src/mcp/instructions/instructions.generated.ts

      - run: pnpm lint

      - run: pnpm test
